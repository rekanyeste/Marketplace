name: nearbuy
description: "A local marketplace for buying and selling nearby"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0

  # State Management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.1.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Utilities
  image_picker: ^1.2.2
  flutter_image_compress: ^2.3.0
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  intl: ^0.20.2
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^0.3.0
  fake_cloud_firestore: ^4.1.0

flutter:
  uses-material-design: true
